<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>醉心亭 · 約戰報名</title>
<meta name="theme-color" content="#17110c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2317110c'/%3E%3Ctext x='50' y='70' font-size='62' text-anchor='middle' fill='%23d4af37' font-family='serif'%3E醉%3C/text%3E%3C/svg%3E">
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22%E9%86%89%E5%BF%83%E4%BA%AD%22%2C%22short_name%22%3A%22%E9%86%89%E5%BF%83%E4%BA%AD%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%2317110c%22%2C%22theme_color%22%3A%22%2317110c%22%7D">
<style>
:root{--bg:#17110c;--card:#221913;--line:#3a2c20;--gold:#d4af37;--gold2:#f0d891;--txt:#efe6d6;--mut:#a99880}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:"PingFang TC","Microsoft JhengHei",system-ui,sans-serif;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:32px 20px 64px}
.badge{display:inline-block;border:1px solid var(--gold);color:var(--gold);border-radius:999px;padding:4px 16px;font-size:12px;letter-spacing:3px}
h1{font-size:40px;margin:18px 0 4px;letter-spacing:6px;color:var(--gold2)}
.sub{color:var(--mut);letter-spacing:2px;margin-bottom:6px}
.rule{display:flex;align-items:center;gap:12px;color:var(--gold);margin:20px 0 28px}
.rule::before,.rule::after{content:'';height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:16px}
.card h3{margin:0 0 6px;color:var(--gold2);font-size:20px}
.meta{color:var(--mut);font-size:14px;margin-bottom:8px}
.desc{color:var(--txt);font-size:15px;margin:0 0 14px}
button{cursor:pointer;font-family:inherit}
.btn{background:var(--gold);color:#1a120a;border:none;border-radius:10px;padding:10px 20px;font-size:15px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.btn-ghost{background:transparent;color:var(--gold);border:1px solid var(--line);border-radius:10px;padding:10px 20px;font-size:15px}
.form{margin-top:16px;border-top:1px solid var(--line);padding-top:16px;display:grid;gap:12px}
.form label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
.form input,.form textarea{width:100%;background:#1a120b;border:1px solid var(--line);border-radius:8px;color:var(--txt);padding:10px 12px;font-size:15px;font-family:inherit}
.form textarea{min-height:64px;resize:vertical}
.msg{border-radius:8px;padding:10px 12px;font-size:14px}
.msg.ok{background:#14301f;color:#8fe0b0;border:1px solid #1f5a38}
.msg.no{background:#3a1414;color:#f0a0a0;border:1px solid #5a2020}
.state{color:var(--mut);text-align:center;padding:32px}
footer{color:var(--mut);text-align:center;font-size:12px;margin-top:32px}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="badge">ZUI XIN TING</div>
  <h1>醉心亭</h1>
  <div class="sub">江湖相逢，共戰為王</div>
  <div class="rule">約戰報名</div>

  <div v-if="loading" class="state">載入活動中…</div>
  <div v-else-if="err" class="state">{{ err }}　<button class="btn-ghost" @click="load">重試</button></div>
  <div v-else-if="events.length===0" class="state">目前沒有開放中的活動。</div>

  <div v-for="e in events" :key="e.id" class="card">
    <h3>{{ e.title }}</h3>
    <div class="meta"><span v-if="e.starts_at">🗓 {{ fmt(e.starts_at) }}</span><span v-if="e.capacity">　· 名額 {{ e.capacity }}</span></div>
    <p class="desc" v-if="e.description">{{ e.description }}</p>
    <button class="btn" v-if="openId!==e.id" @click="toggle(e.id)">我要報名</button>
    <button class="btn-ghost" v-else @click="toggle(e.id)">收起</button>

    <div class="form" v-if="openId===e.id">
      <div><label>暱稱 / 稱號 *</label><input v-model="form.nickname" maxlength="40" placeholder="例：獨孤求敗"></div>
      <div><label>聯絡方式 * (Line / IG / 電話)</label><input v-model="form.contact" maxlength="120" placeholder="讓我們找得到你"></div>
      <div><label>隊伍 / 門派 (選填)</label><input v-model="form.team" maxlength="60"></div>
      <div><label>備註 (選填)</label><textarea v-model="form.note" maxlength="300"></textarea></div>
      <div v-if="done" :class="['msg', done.ok?'ok':'no']">{{ done.msg }}</div>
      <button class="btn" :disabled="submitting" @click="submit(e)">{{ submitting?'送出中…':'送出報名' }}</button>
    </div>
  </div>

  <footer>醉心亭約戰報名系統 · Vue 3 + Deno + Supabase</footer>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
var API = 'https://xltdagmzsycnqbflovff.supabase.co/functions/v1/zxt';
var createApp = Vue.createApp;
createApp({
  data: function(){ return { events:[], loading:true, err:'', openId:null, submitting:false, done:null, form:{nickname:'',contact:'',team:'',note:''} }; },
  mounted: function(){ this.load(); },
  methods: {
    load: async function(){ this.loading=true; this.err=''; try{ var r=await fetch(API+'/events'); var j=await r.json(); this.events=j.events||[]; }catch(e){ this.err='載入失敗，請重試'; } this.loading=false; },
    toggle: function(id){ this.openId = this.openId===id?null:id; this.done=null; this.form={nickname:'',contact:'',team:'',note:''}; },
    fmt: function(d){ if(!d) return ''; try{ return new Date(d).toLocaleString('zh-TW',{month:'long',day:'numeric',hour:'2-digit',minute:'2-digit'}); }catch(e){ return d; } },
    submit: async function(ev){ this.submitting=true; this.done=null; try{ var payload=Object.assign({event_id:ev.id}, this.form); var r=await fetch(API+'/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)}); var j=await r.json(); if(!r.ok){ this.done={ok:false,msg:j.error||'報名失敗'}; } else { this.done={ok:true,msg:'報名成功！我們會盡快與你聯絡。'}; this.form={nickname:'',contact:'',team:'',note:''}; } }catch(e){ this.done={ok:false,msg:'網路錯誤，請稍後再試'}; } this.submitting=false; }
  }
}).mount('#app');
</script>
</body>
</html>
